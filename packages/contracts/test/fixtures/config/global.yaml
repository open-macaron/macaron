# yaml-language-server: $schema=../../../schemas/config-global.schema.json
#
# Defaults for every repository. Projects and repos override them (SCALING.md §2).
# Changes need a review from the platform team (CODEOWNERS).

platformTeam: "@open-macaron/maintainers"
routerModel: anthropic/claude-haiku-5.5

concurrency:
  global: 5

defaults:
  harness: claude
  # Model names are Bifrost's: each must be priced in
  # deploy/bifrost/pricing.json, or the controller refuses to start.
  model: claude-sonnet-5-5
  # No per-mode models: each user picks the model that checks the knowledge rules ("Review model"
  # in the web app, their default model otherwise; open-macaron/macaron#205).
  # Claude Code's small background model. The run's key allows only it and the run's model.
  fastModel: claude-haiku-5-5
  runsOn: ubuntu-24.04
  draftPr: true
  timeoutMinutes: 60
  # USD per run, enforced by the run's LLM key.
  budgets:
    triage: 0.20
    plan: 1.00
    implement: 5.00
    address_review: 2.00
    reproduce: 3.00
    verify: 3.00
    retro: 0.50
    # The ceiling of a review's budget, which follows its rule count (reviewCost).
    review: 1.00
  # A review's budget: baseUsd + perRuleUsd × the rules it checks, at most budgets.review.
  reviewCost:
    baseUsd: 0.10
    perRuleUsd: 0.04
  caps:
    perThreadUsd: 20.00
    perRepoMonthUsd: 150.00
    reviewLoops: 6
    botReviewLoops: 2
    openPrs: 3
  environment:
    source: shared
    name: generic
    params: {}
  commands: {}
  contribution:
    dco: false
    fixCi: false
