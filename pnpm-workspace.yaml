packages:
  - packages/*

# Supply chain: a version must be public for 3 days before we install it.
minimumReleaseAge: 4320

catalog:
  # Release management (versions, changelogs, tags): .changeset/
  "@changesets/cli": 3.0.3
  # Framework
  "@nestjs/common": 12.6.0
  "@nestjs/core": 12.6.0
  "@nestjs/platform-express": 12.6.0
  "@types/express": 5.0.6
  "@nestjs/swagger": 12.1.2
  "@nestjs/terminus": 12.2.0
  "@nestjs/testing": 12.6.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # Data
  "@nestjs/drizzle": 0.0.2
  drizzle-orm: 1.0.0-rc.6
  drizzle-kit: 1.0.0-rc.6
  pg: 8.23.1
  pg-boss: 12.39.0
  "@types/pg": 8.23.1
  # Validation and contracts
  "@hey-api/openapi-ts": 0.99.0
  zod: 4.6.7
  yaml: 2.9.1
  fflate: 0.8.3
  deepmerge-ts: 8.0.2
  # Hand-rolled code replaced by maintained libraries
  file-type: 22.3.0
  "@secretlint/core": 14.1.0
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  mdast-util-frontmatter: 2.0.1
  micromark-extension-frontmatter: 2.0.0
  mdast-util-to-string: 4.0.0
  picomatch: 4.0.7
  "@types/picomatch": 4.0.3
  micromark-extension-gfm: 3.0.0
  unist-util-visit: 5.2.0
  "@types/mdast": 4.0.4
  markdown-table: 3.1.0
  "@sindresorhus/slugify": 4.0.1
  p-retry: 8.0.1
  diff: 9.0.0
  "@octokit/webhooks": 14.2.0
  # Users: GitHub sign-in and sessions (controller), its client (web)
  better-auth: 1.7.27
  # Approved LLM endpoints: only public unicast addresses (IPv4 and IPv6 ranges, IPv4-mapped included)
  ipaddr.js: 2.5.0
  # GitHub, OIDC
  "@octokit/core": 7.0.8
  "@octokit/rest": 22.0.1
  "@octokit/plugin-retry": 8.1.1
  "@octokit/plugin-throttling": 11.0.5
  jose: 6.2.18
  # Logging
  nestjs-pino: 5.3.2
  pino: 10.4.0
  pino-http: 11.0.0
  # Web app (packages/web)
  "@sveltejs/kit": 3.4.0
  "@sveltejs/adapter-node": 6.0.5
  "@sveltejs/vite-plugin-svelte": 7.3.1
  svelte: 5.59.1
  svelte-check: 4.7.8
  vite: 8.3.8
  "@vitejs/plugin-basic-ssl": 2.3.0
  tailwindcss: 4.3.5
  "@tailwindcss/vite": 4.3.5
  eslint-plugin-svelte: 3.24.1
  svelte-eslint-parser: 1.11.0
  globals: 17.14.0
  # shadcn-svelte (components vendored in packages/web/src/lib/components/ui) and what they import
  shadcn-svelte: 1.8.1
  bits-ui: 2.22.0
  "@internationalized/date": 3.12.4
  "@lucide/svelte": 1.78.0
  "@fontsource-variable/inter": 5.3.0
  cn: 0.5.2
  mode-watcher: 1.1.0
  svelte-sonner: 1.2.3
  tailwind-variants: 4.0.2
  tw-animate-css: 1.4.0
  layerchart: 2.11.0
  d3-scale: 4.0.3
  "@types/d3-scale": 4.0.9
  # Tooling
  esbuild: 0.28.2
  "@actions/core": 3.0.1
  typescript: 6.0.3
  "@types/node": 24.19.2
  eslint: 10.15.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.74.0
  vitest: 5.1.1
  "@vitest/coverage-v8": 5.1.1
  unplugin-swc: 2.0.0
  "@swc/core": 1.16.22
  msw: 3.0.7
  "@testcontainers/postgresql": 12.2.2
  # The web app's end-to-end tests (packages/web/e2e)
  "@playwright/test": 1.65.1

# Security fixes in transitive dependencies whose parent pins a vulnerable version exactly. Remove an
# entry once the parent moves past it.
overrides:
  # @hey-api/openapi-ts (code generation) through json-schema-ref-parser 1.4.4, which pins 4.2.0
  # (GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh).
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2

allowBuilds:
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
