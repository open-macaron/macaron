packages:
  - packages/*

# Supply chain: a version must be public for 3 days before we install it.
minimumReleaseAge: 4320

catalog:
  # Framework
  "@nestjs/common": 12.1.3
  "@nestjs/core": 12.1.3
  "@nestjs/platform-express": 12.1.3
  "@nestjs/swagger": 12.0.2
  "@nestjs/terminus": 12.1.0
  "@nestjs/testing": 12.1.3
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # Data
  "@nestjs/drizzle": 0.0.2
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: 8.23.1
  "@types/pg": 8.23.1
  # Validation and contracts
  zod: 4.6.6
  yaml: 2.9.1
  # OpenRouter (official SDK, generated from their OpenAPI spec)
  "@openrouter/sdk": 1.4.25
  # GitHub, OIDC
  "@octokit/core": 7.0.8
  "@octokit/rest": 22.0.1
  "@octokit/plugin-retry": 8.1.1
  "@octokit/plugin-throttling": 11.0.5
  "@octokit/webhooks-methods": 6.0.0
  jose: 6.2.12
  # Logging
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  # Tooling
  typescript: 6.0.3
  "@types/node": 24.19.2
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.1
  vitest: 5.0.4
  "@vitest/coverage-v8": 5.0.4
  unplugin-swc: 2.0.0
  "@swc/core": 1.16.18
  msw: 3.0.3
  "@testcontainers/postgresql": 12.2.0

allowBuilds:
  '@openrouter/sdk': false
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
