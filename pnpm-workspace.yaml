packages:
  - packages/*

# Supply chain: a version must be public for 3 days before we install it.
minimumReleaseAge: 4320

catalog:
  # Release management (versions, changelogs, tags): .changeset/
  "@changesets/cli": 3.0.3
  # Framework
  "@nestjs/common": 12.1.3
  "@nestjs/core": 12.1.3
  "@nestjs/platform-express": 12.1.3
  "@types/express": 5.0.6
  "@nestjs/swagger": 12.0.2
  "@nestjs/terminus": 12.1.0
  "@nestjs/testing": 12.1.3
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  # Data
  "@nestjs/drizzle": 0.0.2
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  pg: 8.23.1
  pg-boss: 12.37.1
  "@types/pg": 8.23.1
  # Validation and contracts
  "@hey-api/openapi-ts": 0.99.0
  zod: 4.6.6
  yaml: 2.9.1
  fflate: 0.8.3
  deepmerge-ts: 8.0.2
  # Hand-rolled code replaced by maintained libraries
  file-type: 22.1.1
  "@secretlint/core": 13.0.7
  "@secretlint/secretlint-rule-preset-recommend": 13.0.7
  "@secretlint/secretlint-rule-pattern": 13.0.7
  mdast-util-from-markdown: 2.1.0
  mdast-util-gfm: 3.1.0
  mdast-util-frontmatter: 2.0.1
  micromark-extension-frontmatter: 2.0.0
  mdast-util-to-string: 4.0.0
  picomatch: 4.0.7
  "@types/picomatch": 4.0.3
  micromark-extension-gfm: 3.0.0
  unist-util-visit: 5.1.0
  "@types/mdast": 4.0.4
  markdown-table: 3.0.4
  "@sindresorhus/slugify": 3.0.1
  p-retry: 8.0.1
  diff: 9.0.0
  "@octokit/webhooks": 14.2.0
  # OpenRouter (official SDK, generated from their OpenAPI spec)
  "@openrouter/sdk": 1.4.25
  # Users: GitHub sign-in and sessions (controller), its client (web)
  better-auth: 1.7.11
  # GitHub, OIDC
  "@octokit/core": 7.0.8
  "@octokit/rest": 22.0.1
  "@octokit/plugin-retry": 8.1.1
  "@octokit/plugin-throttling": 11.0.5
  jose: 6.2.12
  # Logging
  nestjs-pino: 5.3.1
  pino: 10.4.0
  pino-http: 11.0.0
  # Web app (packages/web)
  "@sveltejs/kit": 3.1.0
  "@sveltejs/adapter-node": 6.0.0
  "@sveltejs/vite-plugin-svelte": 7.3.1
  svelte: 5.57.2
  svelte-check: 4.7.7
  vite: 8.3.4
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  eslint-plugin-svelte: 3.23.1
  svelte-eslint-parser: 1.9.0
  globals: 17.13.0
  # shadcn-svelte (components vendored in packages/web/src/lib/components/ui) and what they import
  shadcn-svelte: 1.7.0
  bits-ui: 2.19.5
  "@internationalized/date": 3.12.4
  "@lucide/svelte": 1.60.0
  "@fontsource-variable/inter": 5.3.0
  cn: 0.5.0
  mode-watcher: 1.1.0
  svelte-sonner: 1.2.1
  tailwind-variants: 3.3.1
  tw-animate-css: 1.4.0
  # Tooling
  esbuild: 0.28.2
  "@actions/core": 3.0.1
  typescript: 6.0.3
  "@types/node": 24.19.2
  eslint: 10.12.0
  "@eslint/js": 10.0.1
  typescript-eslint: 8.71.1
  vitest: 5.0.4
  "@vitest/coverage-v8": 5.0.4
  unplugin-swc: 2.0.0
  "@swc/core": 1.16.18
  msw: 3.0.3
  "@testcontainers/postgresql": 12.2.0

allowBuilds:
  '@openrouter/sdk': false
  '@scarf/scarf': false
  '@swc/core': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
