name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The Version Packages PR, when it was opened with GITHUB_TOKEN (no RELEASE_TOKEN): GitHub runs no
  # workflow for it, and main's ruleset requires these checks. Run this on its branch.
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `changeset status` below needs the merge base with main.
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A change to a package ships only through a changeset (.changeset/README.md); one with
      # nothing to release says so with `pnpm changeset --empty`. The Version Packages PR consumes
      # changesets rather than adding one.
      - if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'changeset-release/')
        run: pnpm changeset status --since=origin/main
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      # Unit and integration tests (Testcontainers uses the runner's Docker); live tests skip without credentials.
      - run: pnpm test
      - name: generated code is up to date (JSON Schemas, OpenAPI document, agent-cli client)
        run: |
          pnpm --filter @open-macaron/contracts gen
          pnpm --filter @open-macaron/controller gen
          pnpm --filter @open-macaron/agent-cli gen
          git diff --exit-code -- packages/contracts/schemas packages/contracts/openapi packages/agent-cli/src/generated
      - name: migrations match the schema
        run: pnpm --filter @open-macaron/controller db:check

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build the controller image (not pushed)
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: macaron-controller
          tags: ci
          containerfiles: packages/controller/Containerfile
          context: .
          oci: true
