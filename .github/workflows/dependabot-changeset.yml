name: dependabot-changeset

# A Dependabot bump ships like any other change: through a changeset (.changeset/README.md). CI only
# asks for one when a file under packages/ changes, and a catalog bump touches only the root, so it
# would pass CI and never be released. This adds a patch changeset for every package the bump
# reaches; a bump that reaches none (Actions, root tooling) gets nothing.
#
# pull_request_target, not pull_request: the workflow and the actions it pins come from main, so a
# bump of one of them only reaches the release app's key once it's merged. Under pull_request, the
# PR's own version would run, and Dependabot runs only see Dependabot secrets, so the key would have
# to be one. Nothing from the PR is checked out or executed: the manifests are main's, the bumps come
# from Dependabot's metadata.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-changeset-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    # Dependabot's PRs, on its own pushes only: a maintainer's push and the app's commit below don't
    # run this.
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # main, read with jq only.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: changeset
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          FILE: .changeset/dependabot-${{ github.event.pull_request.number }}.md
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$HEAD_SHA" --silent 2> /dev/null; then
            echo "$FILE is already there"
            exit 0
          fi
          packages=()
          while IFS=$'\t' read -r ecosystem type name directory; do
            case "$ecosystem" in
              # One update across both Containerfiles names one directory only: take the PR's files.
              docker)
                while read -r dir; do
                  packages+=("$(jq -r .name "$dir/package.json")")
                done < <(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
                  --jq '.[].filename | select(test("^packages/[^/]+/Containerfile$")) | sub("/Containerfile$"; "")') ;;
              npm_and_yarn)
                for manifest in packages/*/package.json; do
                  # A transitive bump can land in any package's build: release them all.
                  if [[ "$type" == indirect ]] || jq -e --arg dep "$name" \
                    '[.dependencies, .devDependencies, .peerDependencies, .optionalDependencies] | map(. // {} | has($dep)) | any' \
                    "$manifest" > /dev/null; then
                    packages+=("$(jq -r .name "$manifest")")
                  fi
                done ;;
            esac
          done < <(jq -r '.[] | [.packageEcosystem, .dependencyType, .dependencyName, .directory] | @tsv' <<< "$UPDATES")
          if (( ${#packages[@]} == 0 )); then
            echo "No package to release"
            exit 0
          fi
          {
            echo "---"
            printf '%s\n' "${packages[@]}" | sort -u | jq -R -r '"\(tojson): patch"'
            echo "---"
            echo
            # One line: the changelog's entry. A base image's digest moves within its tag, and its
            # previous "version" is that digest.
            jq -r '"Bump " + (unique_by([.dependencyName, .newVersion]) | map(if .packageEcosystem == "docker"
              then "`\(.dependencyName):\(.newVersion)` (new digest)"
              else "`\(.dependencyName)` (\(.prevVersion) → \(.newVersion))" end) | join(", ")) + "."' <<< "$UPDATES"
          } > "$FILE"
          cat "$FILE"
          echo "content=$(base64 -w0 "$FILE")" >> "$GITHUB_OUTPUT"
      # The commit is the app's: one made with GITHUB_TOKEN runs no workflow, and the required checks
      # would never report on the PR's new head.
      - id: app-token
        if: steps.changeset.outputs.content != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - if: steps.changeset.outputs.content != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          CONTENT: ${{ steps.changeset.outputs.content }}
          FILE: .changeset/dependabot-${{ github.event.pull_request.number }}.md
        run: >-
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" --silent
          -f branch="$BRANCH" -f content="$CONTENT" -f message="chore(deps): add a changeset"
