name: release-agent-cli

# Publishes macaron-agent as a single bundled file on a GitHub release, with a signed build
# provenance attestation. open-macaron/runner pins the asset URL and its sha256; the PR that
# bumps the pin verifies the attestation.
on:
  push:
    branches: [main]
    paths:
      - packages/agent-cli/**
      - packages/review/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - .github/workflows/release-agent-cli.yml

permissions: {}

concurrency:
  group: release-agent-cli
  cancel-in-progress: false

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @open-macaron/agent-cli...
      - run: pnpm --filter @open-macaron/agent-cli build
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/agent-cli/dist/macaron-agent.mjs
      - name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: agent-cli-${{ github.sha }}
        run: |
          sha256="$(sha256sum packages/agent-cli/dist/macaron-agent.mjs | cut -d' ' -f1)"
          gh release create "$TAG" packages/agent-cli/dist/macaron-agent.mjs \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "macaron-agent ${GITHUB_SHA:0:7}" \
            --notes "sha256: \`${sha256}\`"
          {
            echo "URL: https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/macaron-agent.mjs"
            echo "sha256: \`${sha256}\`"
          } >> "$GITHUB_STEP_SUMMARY"
