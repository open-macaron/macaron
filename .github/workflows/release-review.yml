name: release-review

# Publishes the macaron-review CLI to npm as @open-macaron/review when packages/review's version
# changes: npm trusted publishing (OIDC, no token) with provenance, and the same bundle on a
# GitHub release with a build provenance attestation. Publishing is off until the trusted
# publisher is configured on npmjs.com and the repository variable NPM_PUBLISH is "true".
on:
  push:
    branches: [main]
    paths:
      - packages/review/**
      - packages/contracts/**
      - pnpm-lock.yaml
      - .github/workflows/release-review.yml

permissions: {}

concurrency:
  group: release-review
  cancel-in-progress: false

jobs:
  publish:
    if: vars.NPM_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: is this version published?
        id: version
        working-directory: packages/review
        run: |
          version="$(node -p 'require("./package.json").version')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if npm view "@open-macaron/review@${version}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.published == 'false'
        run: pnpm install --frozen-lockfile --filter @open-macaron/review...
      - if: steps.version.outputs.published == 'false'
        working-directory: packages/review
        run: |
          pnpm bundle
          pnpm npm-package
      - if: steps.version.outputs.published == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/review/dist-npm/macaron-review.mjs
      # Trusted publishing: npm exchanges the job's OIDC token, and attaches provenance itself.
      - if: steps.version.outputs.published == 'false'
        working-directory: packages/review/dist-npm
        run: npm publish --access public
      - if: steps.version.outputs.published == 'false'
        name: publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: review-v${{ steps.version.outputs.version }}
        run: |
          sha256="$(sha256sum packages/review/dist-npm/macaron-review.mjs | cut -d' ' -f1)"
          gh release create "$TAG" packages/review/dist-npm/macaron-review.mjs \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "macaron-review ${TAG#review-v}" \
            --notes "npm: \`@open-macaron/review@${TAG#review-v}\` · sha256: \`${sha256}\`"
