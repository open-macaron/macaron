name: release

# Every push to main publishes the controller image, addressed by digest, with a signed build
# provenance attestation (Sigstore, keyless through GitHub OIDC). deploy.sh only installs digests
# whose attestation was produced by this workflow on main.
on:
  push:
    branches: [main]
    paths:
      - packages/contracts/**
      - packages/controller/**
      - packages/review/**
      - pnpm-lock.yaml
      - .github/workflows/release.yml

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  controller-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io/open-macaron
      IMAGE: ghcr.io/open-macaron/controller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: build
        uses: redhat-actions/buildah-build@719e3c40d8af9790c23eca13f7daa339f2867034 # v3.1.0
        with:
          image: controller
          tags: sha-${{ github.sha }}
          containerfiles: packages/controller/Containerfile
          context: .
          oci: true
          build-args: |
            VERSION=sha-${{ github.sha }}
            REVISION=${{ github.sha }}
      - uses: redhat-actions/podman-login@50c2d9a331bb67c8fdab99b86455fad05e2e3252 # v2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: redhat-actions/push-to-registry@94ade333c38ecc0e60e94785125d9a52ca423b37 # v3.0.0
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ${{ env.REGISTRY }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published \`${IMAGE}@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
