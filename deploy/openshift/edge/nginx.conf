# macaron-bot edge: the OpenShift router terminates TLS, this proxy holds the routing contract
# (DESIGN.md §7): the only paths the internet reaches. deploy/bifrost/dev.sh runs it locally too.
worker_processes 2;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  upstream controller {
    server macaron-controller:8080;
  }
  upstream bifrost {
    server macaron-bifrost:8080;
  }
  upstream web {
    server macaron-web:8080;
  }

  # The client's address as the router saw it: the last X-Forwarded-For entry (anything before it
  # came from the client and can be forged). What sign-in's rate limits count on.
  map $http_x_forwarded_for $client_address {
    "~(?<last>[^,\s]+)\s*$" $last;
    default $remote_addr;
  }

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Connection "";

  server {
    listen 8080 default_server;
    server_name _;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The only routes the internet may reach. Health checks stay inside the cluster.
    location = /v1/bootstrap {
      client_max_body_size 26000000;
      proxy_pass http://controller/v1/bootstrap;
    }
    location = /v1/webhook {
      client_max_body_size 26000000;
      proxy_pass http://controller/v1/webhook;
    }

    # Runners' LLM traffic to Bifrost: three exact routes (location = is case-sensitive and matches
    # the normalised path), each passed to its canonical upstream path, so nothing else on Bifrost
    # (admin API, UI, Batch API whose cost is charged after the run's key is gone) is reachable.
    # Streams are passed through as they come.
    location = /llm/anthropic/v1/messages {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32000000;
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_pass http://bifrost/anthropic/v1/messages;
    }
    location = /llm/anthropic/v1/messages/count_tokens {
      if ($request_method != POST) { return 404; }
      client_max_body_size 32000000;
      proxy_pass http://bifrost/anthropic/v1/messages/count_tokens;
    }
    location = /llm/anthropic/v1/models {
      if ($request_method != GET) { return 404; }
      proxy_pass http://bifrost/anthropic/v1/models;
    }

    # Sign-in (better-auth in the controller): GitHub's OAuth redirects and the session API. Small
    # bodies only; the controller reads the client's address from X-Client-Address alone.
    location ^~ /api/auth/ {
      client_max_body_size 64k;
      proxy_set_header X-Client-Address $client_address;
      proxy_pass http://controller/api/auth/;
    }

    # Everything else is the web app (packages/web), which answers its own 404s. Its health check
    # stays inside the cluster like the others.
    location = /healthz {
      return 404;
    }
    location / {
      proxy_pass http://web;
    }
  }

  # Probes only: no Service port points here.
  server {
    listen 8081;
    access_log off;
    location = /healthz {
      return 200;
    }
  }
}
