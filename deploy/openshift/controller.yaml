# The controller: holds every credential (DESIGN.md §3). Secrets come from the macaron-controller
# Secret, operator settings from the macaron-settings ConfigMap (both written by
# scripts/provision-secrets.sh). Its configuration is open-macaron/config's published snapshot
# (CONFIG_URL).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: macaron-controller
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: macaron-controller
spec:
  selector:
    app.kubernetes.io/name: macaron-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macaron-controller
  annotations:
    # A new digest in the macaron-controller ImageStream rolls the controller out.
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"macaron-controller:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"controller\")].image"}]'
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Migrations run under an advisory lock and pg-boss coordinates through Postgres: the new pod can
  # start next to the old one, which keeps serving webhooks until it is ready.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: macaron-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macaron-controller
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: macaron-controller
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          # Set from the macaron-controller ImageStream: by the image trigger on each release, and by
          # deploy.sh to the digest the stream holds, so a deploy never moves the controller.
          image: ghcr.io/open-macaron/controller:latest
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: macaron-settings
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: database-password
            # The full service name is the one the serving certificate carries.
            - name: DATABASE_URL
              value: postgres://macaron:$(DATABASE_PASSWORD)@macaron-postgres.$(POD_NAMESPACE).svc:5432/macaron?sslmode=verify-full&sslrootcert=/etc/service-ca/service-ca.crt
            - name: GH_INTERACT
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: gh-interact
            - name: GH_PUSH
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: gh-push
            - name: GH_ORG
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: gh-org
            - name: WEBHOOK_HMAC
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: webhook-hmac
            - name: BIFROST_ADMIN_URL
              value: http://macaron-bifrost:8080
            # Users' LLM keys are sealed under these key-encryption keys: files, never variables.
            - name: LLM_KEK_DIR
              value: /etc/macaron/llm-kek
            # Sign-in (the web app's users): present once provision-secrets.sh had the GitHub App's
            # credentials; without them the controller runs without sign-in.
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: better-auth-secret
                  optional: true
            - name: GITHUB_LOGIN_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: github-login-client-secret
                  optional: true
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: macaron-controller
                  key: bifrost-admin-password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Migrations, then each LLM backend's start-up checks, before it listens.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 768Mi
          volumeMounts:
            - name: service-ca
              mountPath: /etc/service-ca
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: llm-kek
              mountPath: /etc/macaron/llm-kek
              readOnly: true
      volumes:
        - name: service-ca
          configMap:
            name: macaron-service-ca
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        # Readable by the pod's group only (the fsGroup OpenShift assigns), mounted in this pod only.
        - name: llm-kek
          secret:
            secretName: macaron-llm-kek
            defaultMode: 0440
