# Bifrost: per-run virtual keys over the upstream LLM key (DESIGN.md §3). Reached by the edge on its
# three inference routes and by the controller on its admin API; nothing else.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: macaron-bifrost
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: macaron-bifrost
spec:
  selector:
    app.kubernetes.io/name: macaron-bifrost
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: macaron-bifrost
spec:
  replicas: 1
  revisionHistoryLimit: 5
  # Spend lives in memory and reaches Postgres every 10 s: never two instances charging the same keys.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: macaron-bifrost
  template:
    metadata:
      labels:
        app.kubernetes.io/name: macaron-bifrost
        app.kubernetes.io/component: llm-gateway
    spec:
      serviceAccountName: macaron-bifrost
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # config.json from the repository's template.
        - name: render-config
          image: docker.io/maximhq/bifrost@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
          command:
            - /bin/sh
            - -ceu
            - sh /etc/bifrost/render-config.sh /app/data/config.json
          env:
            - name: PG_SSL_MODE
              value: require
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: files
              mountPath: /etc/bifrost
              readOnly: true
            - name: data
              mountPath: /app/data
      containers:
        - name: bifrost
          # transports/v2.3.2, digest of the multi-arch index. Bump together with the controller's generated
          # admin client (packages/controller/openapi-ts.bifrost.config.ts) and the initContainer above.
          image: docker.io/maximhq/bifrost@sha256:f5b18826349fe9e1c402c10d19f1cbb5567a3c800ad928580d07f72e69106ec7
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LOG_STYLE
              value: json
            - name: BIFROST_ADMIN_USERNAME
              value: macaron
            - name: BIFROST_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: macaron-bifrost
                  key: admin-password
            - name: BIFROST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: macaron-bifrost
                  key: db-password
            # Without it Bifrost stores users' keys (for the length of a run) and every virtual key in plain text in Postgres.
            - name: BIFROST_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: macaron-bifrost
                  key: encryption-key
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          # Its first boot runs ~70 s of database migrations before it reports healthy.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: files
              mountPath: /etc/bifrost
              readOnly: true
            - name: data
              mountPath: /app/data
      volumes:
        - name: files
          configMap:
            name: macaron-bifrost-files
        # Bifrost wants a writable APP_DIR; everything it keeps lives in Postgres.
        - name: data
          emptyDir:
            sizeLimit: 64Mi
