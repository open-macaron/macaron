# Included by the image (postgresql-cfg/*.conf), after its own settings. The certificate is the
# Service's serving certificate, signed and rotated by OpenShift's service CA; clients verify it
# against the injected CA bundle.
ssl = on
ssl_cert_file = '/etc/postgresql-tls/tls.crt'
ssl_key_file = '/etc/postgresql-tls/tls.key'
ssl_min_protocol_version = 'TLSv1.3'
password_encryption = 'scram-sha-256'
# The pod's logs, not files in the data volume.
logging_collector = off
log_destination = 'stderr'
