# The controller follows its releases: `:latest` moves when changesets releases a new controller
# version (release.yml), the cluster re-imports it on its own schedule (about every 15 minutes), and
# the image trigger on deployment/macaron-controller rolls it out. Pods pull the digest straight
# from ghcr.io (referencePolicy Source); the history of imported digests is the rollback list.
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: macaron-controller
  labels:
    app.kubernetes.io/part-of: macaron
spec:
  lookupPolicy:
    local: false
  tags:
    - name: latest
      from:
        kind: DockerImage
        name: ghcr.io/open-macaron/controller:latest
      importPolicy:
        scheduled: true
      referencePolicy:
        type: Source
