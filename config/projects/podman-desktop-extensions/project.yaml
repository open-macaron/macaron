# yaml-language-server: $schema=../../../packages/contracts/schemas/config-project.schema.json
#
# Podman Desktop extensions (podman-desktop/gh-extensions-actions#4), upstream repositories only.
# Only the modern ones: a root Containerfile that installs and builds the extension with pnpm in a
# multi-stage build (podman-desktop/gh-extensions-actions#5), which is what the
# podman-desktop-extensions environment (open-macaron/runner) builds and runs.
# The others join once their Containerfile follows those guidelines.

project: podman-desktop-extensions
owners: "@open-macaron/maintainers"
users:
  - axel7083
bots: []
budget:
  monthUsd: 30.00
concurrency: 1
defaults:
  runsOn: ubuntu-26.04
  timeoutMinutes: 45
  environment:
    source: shared
    name: podman-desktop-extensions
    params: {}
  budgets:
    implement: 5.00
    reproduce: 3.00
    verify: 3.00
    address_review: 2.00
    review: 0.50
  # The DCO check runs on these repositories' pull requests.
  contribution:
    dco: true
