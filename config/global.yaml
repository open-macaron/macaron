# yaml-language-server: $schema=../packages/contracts/schemas/config-global.schema.json
#
# Defaults for every repository. Projects and repos override them (SCALING.md §2).
# Changes need a review from the platform team (CODEOWNERS).

platformTeam: "@open-macaron/maintainers"
routerModel: anthropic/claude-haiku-5.5

concurrency:
  global: 5

defaults:
  harness: claude
  # Model names follow the LLM backend (LLM_BACKEND=bifrost): each must be priced in
  # deploy/bifrost/pricing.json, or the controller refuses to start.
  model: claude-sonnet-5-5
  # Per-mode overrides. Reviews: Sonnet 5.5 over Haiku 4.5, measured on 5 podman-desktop pull
  # requests (packages/review/bench, 2026-10-20): fewer false positives, no lost evidence, the same
  # findings from run to run, and a lower total cost. Revisit when the upstream serves Haiku 5.5.
  models:
    review: claude-sonnet-5-5
  # Claude Code's small background model. The run's key allows only it and the run's model.
  # Haiku 4.5: the upstream doesn't serve Haiku 5.5 yet.
  fastModel: claude-haiku-4-5
  runsOn: ubuntu-24.04
  draftPr: true
  timeoutMinutes: 60
  # USD per run, enforced by the run's LLM key.
  budgets:
    triage: 0.20
    plan: 1.00
    implement: 5.00
    address_review: 2.00
    reproduce: 3.00
    verify: 3.00
    retro: 0.50
    # The ceiling of a review's budget, which follows its rule count (reviewCost).
    review: 1.00
  # A review's budget: baseUsd + perRuleUsd × the rules it checks, at most budgets.review.
  reviewCost:
    baseUsd: 0.10
    perRuleUsd: 0.04
  caps:
    perThreadUsd: 20.00
    perRepoMonthUsd: 150.00
    reviewLoops: 6
    botReviewLoops: 2
    openPrs: 3
  environment:
    source: shared
    name: generic
    params: {}
  commands: {}
  capabilities: []
  contribution:
    dco: false
    fixCi: false
